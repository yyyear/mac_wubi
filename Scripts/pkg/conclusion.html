<!DOCTYPE html>
<html lang="zh-Hans">
<head><meta charset="utf-8"><style>
body { font: 13px -apple-system, "PingFang SC"; color: #222; margin: 0; }
h2 { font-size: 15px; margin: 0 0 8px; }
p, li { line-height: 1.6; }
kbd { background: #eee; border-radius: 4px; padding: 1px 5px; font: 12px ui-monospace; }
</style></head>
<body>
<h2>安装完成</h2>
<p>切换到「四方五笔」开始输入：</p>
<ul>
  <li>菜单栏输入法图标 → 四方五笔</li>
  <li>或按 <kbd>Ctrl</kbd>+<kbd>空格</kbd> 切换上一个/下一个输入法</li>
</ul>
<p>如果没有立刻出现，请注销并重新登录一次——macOS 只在登录时扫描输入法目录。</p>
<p>在状态栏输入法菜单中选择中文输入方案，或选择「偏好设置…」调整候选、标点与模糊音。菜单支持鼠标点选，也可用方向键选择、回车确认。</p>
</body>
</html>
