<!DOCTYPE html>
<html lang="zh-Hans">
<head><meta charset="utf-8"><style>
body { font: 13px -apple-system, "PingFang SC"; color: #222; margin: 0; }
h2 { font-size: 15px; margin: 0 0 8px; }
p, li { line-height: 1.6; }
</style></head>
<body>
<h2>四方五笔 · 五笔与全拼</h2>
<p>一个系统输入源，三种中文输入方案：</p>
<ul>
  <li>打开状态栏输入法菜单，用鼠标或方向键和回车选择「只五笔」「只拼音」或「拼音五笔混合」</li>
  <li>在「输入 → 模糊音」逐项选择常混淆的声母与韵尾；准确输入优先</li>
  <li>单击 Shift 切换中英文，已打编码以英文原样上屏</li>
  <li>支持从本机导入 Rime、搜狗拼音 SCEL 和 UTF-8 文本词表</li>
</ul>
<p>安装完成后，输入法会自动加入系统输入法列表。如果暂时没看到，注销并重新登录一次即可。</p>
</body>
</html>
